<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strange World | Secure Vault & DRM</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/DPmtLPMj/Icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@300;400;900&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="auth-system">

    <!-- LOGIN -->
    <div id="view-start" class="auth-card">

        <h2 class="orange-title">IDENTITY</h2>

        <input 
            type="text" 
            id="id-input" 
            placeholder="Username or Email">

        <button class="btn-action" onclick="goToPassword()">
            CONTINUE
        </button>


        <div class="separator">OR</div>


        <div id="g_id_onload"
             data-client_id="976725715682-qn73g5lfndmj0uvgboq5t75kfgchqn9u.apps.googleusercontent.com"
             data-callback="handleGoogle">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-theme="filled_black">
        </div>


        <span class="link" onclick="switchView('view-reg')">
            Register Account
        </span>

    </div>



    <!-- PASSWORD -->
    <div id="view-pass" class="auth-card hidden">

        <h2 class="cyan-title">
            PASSWORD
        </h2>

        <p id="target-display"></p>


        <input 
            type="password"
            id="pass-field"
            placeholder="••••••••">


        <button class="btn-action" onclick="finalizeLogin()">
            ENTER VAULT
        </button>


        <span class="link" onclick="switchView('view-start')">
            Back
        </span>

    </div>



    <!-- REGISTER -->
    <div id="view-reg" class="auth-card hidden">

        <h2 class="orange-title">
            SIGN UP
        </h2>


        <div id="reg-form">


            <input 
                type="text"
                id="reg-user"
                placeholder="Username">


            <input
                type="email"
                id="reg-mail"
                placeholder="Email">


            <label class="birth-label">
                Date of Birth
            </label>


            <input
                type="date"
                id="reg-birth">


            <button
                class="btn-action"
                id="btn-send-reg"
                onclick="sendRegisterCode()">

                SEND CODE

            </button>


        </div>



        <div id="reg-verify" class="hidden">


            <p class="small-text">
                Enter the 6-digit verification code sent to your email
            </p>


            <input
                type="text"
                id="reg-otp"
                maxlength="6"
                class="otp-input"
                placeholder="000000">


            <button
                class="btn-action cyan-button"
                onclick="verifyRegisterCode()">

                VERIFY & CREATE

            </button>


        </div>


        <span class="link" onclick="switchView('view-start')">
            Back to Login
        </span>


    </div>



    <!-- PASSWORD RECOVERY -->

    <div id="view-recovery" class="auth-card hidden">

        <h2 class="cyan-title">
            RECOVERY
        </h2>


        <input
            type="email"
            id="recover-mail"
            placeholder="Account Email">


        <button
            class="btn-action"
            onclick="sendRecoveryCode()">

            SEND RECOVERY CODE

        </button>


        <span class="link" onclick="switchView('view-start')">
            Back
        </span>


    </div>


</div>





<!-- VAULT -->

<main id="vault-ui">


<header>

<h1>
THE VAULT
</h1>


<div class="user-controls">

<span id="user-display"></span>


<button onclick="logout()">
LOGOUT
</button>


</div>


</header>





<section class="store-box">


<div class="game-card">


<h3>
SHADOW HOPE
</h3>


<p>
Official Setup.exe for Windows
<br>
IARC 7+ Classification
</p>


<!-- 
     VACÍO INTENCIONAL
     El botón será creado por JavaScript
-->

<div id="dynamicDownloadArea"></div>


</div>


</section>




</main>





<script src="script.js"></script>


</body>
</html>
