<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strange World | Secure Vault</title>


<link rel="icon" href="https://i.ibb.co/DPmtLPMj/Icon.png">


<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@300;400;900&display=swap" rel="stylesheet">


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>


<style>

:root{
--orange:#ff4500;
--cyan:#00e5ff;
--dark:#020202;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rubik',sans-serif;
}


body{

background:#020202;
color:white;
min-height:100vh;

}



.hidden{

display:none!important;

}



#auth-system{

position:fixed;
inset:0;

background:rgba(0,0,0,.97);

display:flex;
align-items:center;
justify-content:center;

z-index:9999;

}



.auth-card{

width:420px;

background:#080808;

border:2px solid var(--orange);

border-radius:30px;

padding:40px;

text-align:center;

}



h2{

font-family:'Lilita One';

font-size:2.5rem;

}



.orange-title{

color:var(--orange);

}



.cyan-title{

color:var(--cyan);

}



input{

width:100%;

padding:15px;

margin:10px 0;

background:#111;

border:1px solid #333;

border-radius:12px;

color:white;

text-align:center;

}



.btn-action{

width:100%;

padding:15px;

margin-top:10px;

border:none;

border-radius:12px;

background:var(--orange);

color:white;

font-family:'Lilita One';

font-size:1.2rem;

cursor:pointer;

}



.btn-action:hover{

background:white;

color:var(--orange);

}



.cyan-button{

background:var(--cyan);

color:black;

}



.link{

display:block;

margin-top:15px;

color:var(--cyan);

cursor:pointer;

}



.small-text{

color:#777;

font-size:.85rem;

margin:15px;

}



.otp-input{

border:2px dashed var(--cyan);

font-size:1.5rem;

letter-spacing:8px;

}



#vault-ui{

padding:40px 8%;

opacity:0;

filter:blur(20px);

transition:1s;

}



#vault-ui.unlocked{

opacity:1;

filter:blur(0);

}



header{

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:4px solid var(--orange);

padding-bottom:20px;

}



header h1{

font-family:'Lilita One';

font-size:3rem;

}



.user-controls{

display:flex;

gap:20px;

align-items:center;

}



.user-controls button{

background:none;

border:1px solid #444;

color:white;

padding:8px 15px;

border-radius:10px;

}



.store-box{

margin-top:60px;

text-align:center;

}



.game-card{

display:inline-block;

background:#0a0a0a;

padding:40px;

border-radius:30px;

border:1px solid #222;

width:350px;

}



.game-card h3{

font-family:'Lilita One';

font-size:2rem;

color:var(--cyan);

}



.game-card p{

color:#777;

margin:15px 0;

}



.download-btn{

width:100%;

padding:15px;

background:var(--orange);

border:none;

border-radius:12px;

color:white;

font-family:'Lilita One';

font-size:1.2rem;

cursor:pointer;

}



.age-denied{

background:#330000;

border:2px solid red;

padding:20px;

border-radius:15px;

color:#ff5555;

margin-top:20px;

font-family:'Lilita One';

}


@media(max-width:600px){

.auth-card{

width:90%;

}

header{

flex-direction:column;

gap:20px;

}

}


</style>

</head>


<body>


<div id="auth-system">



<!-- LOGIN -->

<div id="view-start" class="auth-card">


<h2 class="orange-title">
IDENTITY
</h2>


<input id="id-input" placeholder="Username or Email">


<input id="login-password" type="password" placeholder="Password">


<button class="btn-action" onclick="login()">

CONTINUE

</button>



<div style="margin:20px;color:#444">

OR

</div>


<div id="google-login"></div>



<span class="link" onclick="show('view-reg')">

Register Account

</span>


<span class="link" onclick="show('view-recovery')">

Forgot Password?

</span>


</div>





<!-- REGISTER -->


<div id="view-reg" class="auth-card hidden">


<h2 class="orange-title">
SIGN UP
</h2>


<input id="reg-user" placeholder="Username">


<input id="reg-mail" placeholder="Email">


<input id="reg-birth" type="date">


<button class="btn-action" onclick="sendCode()">

SEND CODE

</button>



<div id="verify-box" class="hidden">


<input id="reg-code" class="otp-input" placeholder="000000">


<button class="btn-action cyan-button" onclick="verifyCode()">

VERIFY CODE

</button>


</div>



<span class="link" onclick="show('view-start')">

Back

</span>


</div>


<!-- CONTINUA -->
<!-- CREATE PASSWORD -->

<div id="view-password" class="auth-card hidden">


<h2 class="cyan-title">
CREATE PASSWORD
</h2>


<input 
id="new-password" 
type="password" 
placeholder="New Password">


<input 
id="confirm-password" 
type="password" 
placeholder="Confirm Password">


<button class="btn-action" onclick="createAccount()">

CREATE ACCOUNT

</button>


</div>





<!-- RECOVERY -->


<div id="view-recovery" class="auth-card hidden">


<h2 class="cyan-title">

RECOVERY

</h2>


<input 
id="recover-email"
placeholder="Email">


<button 
class="btn-action"
onclick="sendRecovery()">

SEND CODE

</button>



<div id="recover-box" class="hidden">


<input 
id="recover-code"
class="otp-input"
placeholder="000000">


<input 
id="recover-new-pass"
type="password"
placeholder="New Password">



<button 
class="btn-action cyan-button"
onclick="changePassword()">

CHANGE PASSWORD

</button>


</div>



<span class="link" onclick="show('view-start')">

Back

</span>


</div>


</div>





<!-- VAULT -->


<main id="vault-ui">


<header>


<h1>
THE VAULT
</h1>


<div class="user-controls">


<span id="user-display"></span>


<button onclick="logout()">

LOGOUT

</button>


</div>


</header>





<div class="store-box">


<div class="game-card">


<h3>
SHADOW HOPE
</h3>


<p>

Official Setup.exe

<br>

IARC 7+ Classification

</p>



<div id="dynamicDownloadArea"></div>


</div>


</div>



</main>






<script>


// =================================
// CONFIGURA TUS DATOS AQUI (EMAILJS)
// =================================

const EMAIL_PUBLIC_KEY = "P4Ip15Cpxqbl8dLG1";

const EMAIL_SERVICE = "service_oyw7kda";

const TEMPLATE_REGISTER = "template_ec1vtkq";

const TEMPLATE_RECOVERY = "template_5ym9ghb";

const DOWNLOAD_URL = "TU_LINK_DESCARGA";




// Inicializar EmailJS

emailjs.init(
EMAIL_PUBLIC_KEY
);




// Variables


let registerCode = null;

let recoveryCode = null;

let tempUser = null;

let currentUser = null;





// ================================
// UI
// ================================


function show(id){


document
.querySelectorAll(".auth-card")
.forEach(x=>{

x.classList.add("hidden");

});


document
.getElementById(id)
.classList.remove("hidden");


}






// ================================
// DATABASE
// ================================



function getUsers(){


let data =
localStorage.getItem("UsersDB");


if(!data)
return [];



try{


return JSON.parse(
atob(data)
);


}catch{

return [];

}


}




function saveUsers(users){


localStorage.setItem(

"UsersDB",

btoa(
JSON.stringify(users)
)

);


}






// ================================
// REGISTRO EMAIL
// ================================



function sendCode(){


let email =
document.getElementById("reg-mail").value;



let user =
document.getElementById("reg-user").value;



let birth =
document.getElementById("reg-birth").value;



if(!email || !user || !birth){

alert("Complete all fields");

return;

}




registerCode =
Math.floor(

100000 +
Math.random()*900000

).toString();



tempUser = {

username:user,

email:email,

birth:birth

};




emailjs.send(

EMAIL_SERVICE,

TEMPLATE_REGISTER,

{

to_email:email,

verification_code:registerCode

}

)

.then(()=>{


document
.getElementById("verify-box")
.classList.remove("hidden");


alert("Code sent");


})

.catch(err=>{


console.log(err);

alert("Email error");


});


}






function verifyCode(){


let code =
document.getElementById("reg-code").value;



if(code !== registerCode){

alert("Invalid code");

return;

}



show("view-password");


}







// ================================
// CREAR CUENTA
// ================================


function createAccount(){



let pass =
document.getElementById("new-password").value;



let confirm =
document.getElementById("confirm-password").value;



if(pass.length < 6){

alert("Password minimum 6 characters");

return;

}



if(pass !== confirm){

alert("Passwords don't match");

return;

}




let users =
getUsers();



users.push({

username:
tempUser.username,

email:
tempUser.email,

birth:
tempUser.birth,

password:
pass


});




saveUsers(users);



alert("Account created");



show("view-start");



}
// ================================
// LOGIN
// ================================


function login(){


let user =
document.getElementById("id-input").value;



let pass =
document.getElementById("login-password").value;



let users =
getUsers();



let found =
users.find(x=>

(
x.username === user ||
x.email === user
)

&&

x.password === pass

);




if(!found){


alert("Invalid credentials");

return;


}



currentUser = found;



unlockVault(
found.username
);



}







// ================================
// RECOVERY
// ================================



function sendRecovery(){


let email =
document.getElementById("recover-email").value;



if(!email){

alert("Email required");

return;

}



recoveryCode =

Math.floor(

100000 +

Math.random()*900000

).toString();





emailjs.send(

EMAIL_SERVICE,

TEMPLATE_RECOVERY,

{

to_email:email,

verification_code:recoveryCode

}

)

.then(()=>{


document
.getElementById("recover-box")
.classList.remove("hidden");



alert("Recovery code sent");



})

.catch(err=>{


console.log(err);

alert("Email error");


});


}






function changePassword(){



let email =
document.getElementById("recover-email").value;



let code =
document.getElementById("recover-code").value;



let newPass =
document.getElementById("recover-new-pass").value;



if(code !== recoveryCode){


alert("Invalid recovery code");


return;


}



let users =
getUsers();




let index =
users.findIndex(x=>

x.email === email

);




if(index === -1){


alert("Account not found");


return;


}



users[index].password =
newPass;



saveUsers(users);



alert(
"Password changed successfully"
);



show("view-start");



}








// ================================
// GOOGLE LOGIN OPCIONAL
// ================================



function handleGoogle(response){


let data =

JSON.parse(

atob(

response.credential
.split(".")[1]

)

);



currentUser = {

username:
data.given_name

};



unlockVault(
data.given_name
);



}








// ================================
// VAULT
// ================================



function unlockVault(name){



document
.getElementById("auth-system")
.style.display="none";



document
.getElementById("vault-ui")
.classList.add("unlocked");



document
.getElementById("user-display")
.innerText =
name.toUpperCase();



createDownloadArea();



}





function logout(){


location.reload();


}








// ================================
// IARC 7+ CONTROL
// ================================



function calculateAge(date){


let birth =
new Date(date);



let today =
new Date();



let age =
today.getFullYear()
-
birth.getFullYear();



let month =
today.getMonth()
-
birth.getMonth();




if(

month < 0 ||

(
month === 0 &&
today.getDate()
<
birth.getDate()
)

){

age--;

}



return age;


}







function createDownloadArea(){



let area =
document.getElementById(
"dynamicDownloadArea"
);



area.innerHTML="";





if(!currentUser || !currentUser.birth){


area.innerHTML = `

<div class="age-denied">

AGE VERIFICATION REQUIRED

</div>

`;


return;


}






let age =
calculateAge(
currentUser.birth
);






if(age >= 7){



let button =
document.createElement(
"button"
);



button.className =
"download-btn";



button.innerText =
"DOWNLOAD SETUP.EXE";



button.onclick=function(){


window.location.href =
DOWNLOAD_URL;


};



area.appendChild(button);



}

else{



area.innerHTML = `


<div class="age-denied">


ACCESS DENIED

<br>

IARC 7+ REQUIREMENT NOT MET


</div>


`;



}



}







</script>


</body>

</html>
