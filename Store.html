<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Strange World | Secure Vault & Community</title>


<link rel="icon" href="https://i.ibb.co/DPmtLPMj/Icon.png">


<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@300;400;900&display=swap" rel="stylesheet">


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>


<style>

:root{
--orange:#ff4500;
--cyan:#00e5ff;
--dark:#020202;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Rubik',sans-serif;
}


body{
background:#020202;
color:white;
min-height:100vh;
}



.hidden{
display:none!important;
}



#auth-system{
position:fixed;
inset:0;
background:rgba(0,0,0,.97);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
padding: 20px;
overflow-y: auto;
}



.auth-card{
width: 100%;
max-width: 420px;
background:#080808;
border:2px solid var(--orange);
border-radius:30px;
padding: 30px 20px;
text-align:center;
margin: auto;
}



h2{
font-family:'Lilita One';
font-size:2.5rem;
}



.orange-title{
color:var(--orange);
}



.cyan-title{
color:var(--cyan);
}



input, textarea, select{
width:100%;
padding:15px;
margin:10px 0;
background:#111;
border:1px solid #333;
border-radius:12px;
color:white;
text-align:center;
resize: vertical;
}

textarea{
text-align: left;
}



.btn-action{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:12px;
background:var(--orange);
color:white;
font-family:'Lilita One';
font-size:1.2rem;
cursor:pointer;
}



.btn-action:hover{
background:white;
color:var(--orange);
}



.cyan-button{
background:var(--cyan);
color:black;
}



.link{
display:block;
margin-top:15px;
color:var(--cyan);
cursor:pointer;
}



.small-text{
color:#777;
font-size:.85rem;
margin:15px;
}



.otp-input{
border:2px dashed var(--cyan);
font-size:1.5rem;
letter-spacing:8px;
}



#vault-ui{
padding:40px 5%;
opacity:0;
filter:blur(20px);
transition:1s;
}



#vault-ui.unlocked{
opacity:1;
filter:blur(0);
}



header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:4px solid var(--orange);
padding-bottom:20px;
flex-wrap: wrap;
gap: 15px;
}



header h1{
font-family:'Lilita One';
font-size:2.5rem;
cursor: pointer;
}



.user-controls{
display:flex;
gap:15px;
align-items:center;
flex-wrap: wrap;
}



.user-controls button, .nav-switch-btn{
background:none;
border:1px solid #444;
color:white;
padding:8px 15px;
border-radius:10px;
cursor: pointer;
font-family:'Lilita One';
letter-spacing: 0.5px;
}

.nav-switch-btn{
background: var(--orange);
border: none;
color: white;
}



.user-display-container{
display: flex;
align-items: center;
gap: 12px;
background: #111;
padding: 6px 15px 6px 6px;
border-radius: 50px;
border: 1px solid #333;
cursor: pointer;
}

.user-display-container:hover{
border-color: var(--cyan);
}

.user-avatar-box{
width: 40px;
height: 40px;
border-radius: 50%;
overflow: hidden;
background: #222;
display: flex;
align-items: center;
justify-content: center;
position: relative;
cursor: pointer;
border: 2px solid var(--cyan);
}

.user-avatar-box img{
width: 100%;
height: 100%;
object-fit: cover;
}

.user-avatar-box span{
font-size: 1.5rem;
color: var(--cyan);
font-family: 'Lilita One';
}

.user-avatar-box input[type="file"]{
position: absolute;
inset: 0;
opacity: 0;
cursor: pointer;
width: 100%;
height: 100%;
}

.username-text{
font-weight: bold;
font-size: 1.1rem;
display: flex;
align-items: center;
gap: 6px;
}



.views-container{
display: none;
}

.views-container.active-view{
display: block;
}



.main-layout{
display: grid;
grid-template-columns: 320px 1fr;
gap: 30px;
margin-top: 40px;
}



@media(max-width: 900px){
.main-layout{
grid-template-columns: 1fr;
}
}



.sidebar{
background: #080808;
border: 1px solid #222;
border-radius: 20px;
padding: 20px;
height: fit-content;
}



.sidebar h3{
font-family: 'Lilita One';
color: var(--cyan);
margin-bottom: 15px;
font-size: 1.5rem;
}



.friend-item, .request-item{
display: flex;
justify-content: space-between;
align-items: center;
background: #111;
padding: 10px;
border-radius: 10px;
margin-bottom: 10px;
font-size: 0.9rem;
}



.friend-item button, .request-item button{
padding: 5px 10px;
background: var(--cyan);
color: black;
border: none;
border-radius: 6px;
cursor: pointer;
font-weight: bold;
}



.content-feed{
display: flex;
flex-direction: column;
gap: 30px;
}



.store-grid{
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 20px;
}



.game-card{
background:#0a0a0a;
padding:25px 20px;
border-radius:20px;
border:1px solid #222;
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
gap: 15px;
position: relative;
}

.game-card-header{
display: flex;
align-items: center;
gap: 15px;
width: 100%;
justify-content: center;
}

.game-card-logo{
width: 60px;
height: 60px;
border-radius: 12px;
object-fit: cover;
border: 1px solid var(--cyan);
background: #111;
}

.game-card h3{
font-family:'Lilita One';
font-size:1.6rem;
color:var(--cyan);
margin: 0;
}



.download-buttons-box{
display: flex;
flex-direction: column;
gap: 10px;
width: 100%;
}



.download-btn{
width:100%;
padding:12px;
background:var(--orange);
border:none;
border-radius:10px;
color:white;
font-family:'Lilita One';
font-size:1.1rem;
cursor:pointer;
text-decoration: none;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
text-align: center;
}



.download-btn.microsoft{
background: #0067b8;
}

.download-btn.coming-soon{
background: #333;
color: #888;
cursor: not-allowed;
}

.microsoft-logo{
width: 20px;
height: 20px;
object-fit: contain;
}



.age-denied{
background:#330000;
border:2px solid red;
padding:15px;
border-radius:12px;
color:#ff5555;
font-family:'Lilita One';
font-size: 0.9rem;
text-align: center;
width: 100%;
}



.post-creator{
background: #080808;
border: 2px solid #222;
border-radius: 20px;
padding: 20px;
}



.post-creator textarea{
background: #111;
border: 1px solid #333;
color: white;
padding: 15px;
border-radius: 12px;
width: 100%;
margin-bottom: 10px;
}



.post-creator input[type="file"]{
background: none;
border: none;
padding: 5px 0;
color: #aaa;
}



.feed-container{
display: flex;
flex-direction: column;
gap: 20px;
}



.post-card{
background: #0a0a0a;
border: 1px solid #222;
border-radius: 20px;
padding: 20px;
}



.post-header{
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
}



.post-author{
display: flex;
align-items: center;
gap: 10px;
font-weight: bold;
font-size: 1.1rem;
cursor: pointer;
}

.post-author:hover{
color: var(--cyan);
}

.post-avatar{
width: 32px;
height: 32px;
border-radius: 50%;
object-fit: cover;
border: 1px solid var(--cyan);
}



.verified-badge{
width: 18px;
height: 18px;
vertical-align: middle;
}



.post-media{
width: 100%;
max-height: 400px;
object-fit: cover;
border-radius: 12px;
margin: 15px 0;
}



.post-text{
color: #ddd;
margin-bottom: 15px;
line-height: 1.5;
word-break: break-word;
}



.post-actions{
display: flex;
gap: 15px;
align-items: center;
border-top: 1px solid #1a1a1a;
padding-top: 15px;
margin-top: 15px;
}



.action-btn{
background: none;
border: none;
color: #888;
cursor: pointer;
font-size: 0.95rem;
display: flex;
align-items: center;
gap: 5px;
}



.action-btn:hover, .action-btn.active{
color: var(--cyan);
}



.comments-section{
margin-top: 15px;
border-top: 1px dashed #222;
padding-top: 15px;
}



.comment-item{
background: #111;
padding: 10px;
border-radius: 8px;
margin-bottom: 8px;
font-size: 0.9rem;
display: flex;
align-items: center;
gap: 8px;
}



.comment-form{
display: flex;
gap: 10px;
margin-top: 10px;
}



.comment-form input{
margin: 0;
padding: 8px 12px;
font-size: 0.9rem;
}



.comment-form button{
padding: 0 15px;
background: var(--orange);
border: none;
border-radius: 8px;
color: white;
font-family: 'Lilita One';
cursor: pointer;
}



.admin-panel{
background: #150000;
border: 1px solid #ff4444;
padding: 15px;
border-radius: 12px;
margin-top: 15px;
display: flex;
gap: 10px;
align-items: center;
flex-wrap: wrap;
}



.admin-btn{
background: #ff4444;
color: white;
border: none;
padding: 6px 12px;
border-radius: 6px;
cursor: pointer;
font-weight: bold;
font-size: 0.85rem;
}



.add-game-header-btn {
background: var(--orange);
color: white;
border: none;
padding: 8px 18px;
border-radius: 10px;
cursor: pointer;
font-family: 'Lilita One';
letter-spacing: 0.5px;
}

.add-game-header-btn:hover {
background: white;
color: var(--orange);
}

.add-game-dropdown-container {
position: absolute;
top: 85px;
right: 5%;
width: 100%;
max-width: 420px;
background: #080808;
border: 2px solid var(--orange);
border-radius: 20px;
padding: 20px;
z-index: 1000;
box-shadow: 0 15px 35px rgba(0,0,0,0.9);
}



.search-results-box {
position: absolute;
background: #080808;
border: 1px solid var(--orange);
border-radius: 12px;
width: 100%;
max-width: 320px;
z-index: 100;
margin-top: 5px;
max-height: 250px;
overflow-y: auto;
box-shadow: 0 10px 25px rgba(0,0,0,0.8);
}

.search-result-item {
padding: 12px 15px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #1a1a1a;
cursor: pointer;
transition: background 0.2s;
}

.search-result-item:hover {
background: #151515;
}



@media(max-width:600px){
.auth-card{
padding: 20px 15px;
}
header{
flex-direction:column;
gap:20px;
}
.add-game-dropdown-container {
right: 20px;
left: 20px;
max-width: none;
}
}


</style>

</head>


<body>


<div id="auth-system">



<!-- LOGIN -->

<div id="view-start" class="auth-card">


<h2 class="orange-title">
IDENTITY
</h2>


<input id="id-input" placeholder="Username or Email">


<input id="login-password" type="password" placeholder="Password">


<button class="btn-action" onclick="login()">

CONTINUE

</button>



<div style="margin:20px;color:#444">

OR

</div>


<div id="google-login"></div>



<span class="link" onclick="show('view-reg')">

Register Account

</span>


<span class="link" onclick="show('view-recovery')">

Forgot Password?

</span>


</div>





<!-- REGISTER -->


<div id="view-reg" class="auth-card hidden">


<h2 class="orange-title">
SIGN UP
</h2>


<input id="reg-user" placeholder="Username">


<input id="reg-mail" placeholder="Email">


<input id="reg-birth" type="date">


<button class="btn-action" onclick="sendCode()">

SEND CODE

</button>



<div id="verify-box" class="hidden">


<input id="reg-code" class="otp-input" placeholder="000000">


<button class="btn-action cyan-button" onclick="verifyCode()">

VERIFY CODE

</button>


</div>



<span class="link" onclick="show('view-start')">

Back

</span>


</div>


<!-- CREATE PASSWORD -->

<div id="view-password" class="auth-card hidden">


<h2 class="cyan-title">
CREATE PASSWORD
</h2>


<input 
id="new-password" 
type="password" 
placeholder="New Password">


<input 
id="confirm-password" 
type="password" 
placeholder="Confirm Password">


<button class="btn-action" onclick="createAccount()">

CREATE ACCOUNT

</button>


</div>





<!-- RECOVERY -->


<div id="view-recovery" class="auth-card hidden">


<h2 class="cyan-title">

RECOVERY

</h2>


<input 
id="recover-email"
placeholder="Email">


<button 
class="btn-action"
onclick="sendRecovery()">

SEND CODE

</button>



<div id="recover-box" class="hidden">


<input 
id="recover-code"
class="otp-input"
placeholder="000000">


<input 
id="recover-new-pass"
type="password"
placeholder="New Password">



<button 
class="btn-action cyan-button"
onclick="changePassword()">

CHANGE PASSWORD

</button>


</div>



<span class="link" onclick="show('view-start')">

Back

</span>


</div>


</div>





<!-- VAULT -->


<main id="vault-ui">


<header style="position: relative;">


<h1 onclick="goHome()">
THE VAULT
</h1>


<div class="user-controls">

<div id="admin-add-game-header-container"></div>

<button id="nav-switch-btn" class="nav-switch-btn" onclick="toggleMainView()">COMMUNITY</button>

<div class="user-display-container" onclick="navigateToProfile(currentUser.username)">
<div class="user-avatar-box" id="header-avatar-box" title="Change Avatar" onclick="event.stopPropagation()">
<span id="avatar-fallback">+</span>
<img id="avatar-img" class="hidden" alt="Avatar">
<input type="file" id="avatar-file-input" accept="image/*" onchange="uploadAvatar(this)">
</div>
<span id="user-display" class="username-text"></span>
</div>


<button onclick="logout()">

LOGOUT

</button>


</div>


</header>



<!-- VISTA STORE -->
<div id="view-store" class="views-container active-view">
<div class="store-box" style="margin-top:30px;">
    
<div id="store-games-grid" class="store-grid"></div>

</div>
</div>



<!-- VISTA COMMUNITY -->
<div id="view-community" class="views-container">
<div class="main-layout">

<aside class="sidebar">
<h3>COMMUNITY</h3>
<div style="margin-bottom: 20px; position: relative;">
<input id="friend-search-input" placeholder="Search user..." style="margin-bottom: 0px; font-size: 0.9rem; padding: 10px;" oninput="handleUserSearchInput(this.value)" autocomplete="off">
<div id="search-results-container" class="search-results-box hidden"></div>
<button class="btn-action" style="margin-top:8px; padding: 10px; font-size: 1rem;" onclick="sendFriendRequestFromInput()">Add Friend</button>
</div>

<h4 style="color:var(--orange); margin-bottom: 10px; font-size: 1rem;">Friend Requests</h4>
<div id="requests-container"></div>

<h4 style="color:var(--cyan); margin-bottom: 10px; font-size: 1rem; margin-top: 20px;">Friends List</h4>
<div id="friends-container"></div>
</aside>


<div class="content-feed">

<div id="profile-header-container" class="hidden"></div>

<div id="post-creator-box" class="post-creator">
<textarea id="post-text-content" rows="3" placeholder="What's happening in Strange World? Share text, photos or videos..."></textarea>
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
<input type="file" id="post-media-file" accept="image/*,video/*">
<button class="btn-action" style="width: auto; padding: 10px 25px; margin-top: 0;" onclick="createPost()">POST</button>
</div>
</div>


<div id="feed-posts-container" class="feed-container"></div>

</div>

</div>
</div>



</main>






<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase/app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.0/firebase/analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyCH1zFMTERRa-UfjhtBvpIvTb3r3GNhTfY",
  authDomain: "strangeworld-84ea7.firebaseapp.com",
  projectId: "strangeworld-84ea7",
  storageBucket: "strangeworld-84ea7.firebasestorage.app",
  messagingSenderId: "85741297859",
  appId: "1:85741297859:web:e7dbee985bc6adacfcc276",
  measurementId: "G-NSEVDMRW3S"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

const EMAIL_PUBLIC_KEY = "yUvWoq451Lb_sn__9";
const EMAIL_SERVICE = "service_oyw7kda";
const TEMPLATE_REGISTER = "template_ec1vtkq";
const TEMPLATE_RECOVERY = "template_5ym9ghb";

const MICROSOFT_LOGO_SVG = '<img src="https://upload.wikimedia.org/wikipedia/commons/9/96/Microsoft_logo_%282012%29.svg" class="microsoft-logo" alt="Microsoft">';
const VERIFIED_BADGE_HTML = '<img src="Creator.png" class="verified-badge" alt="Verified">';

emailjs.init(EMAIL_PUBLIC_KEY);

let registerCode = null;
let recoveryCode = null;
let tempUser = null;
let currentUser = null;
let currentActiveView = "store";
let viewingProfileUser = null;

function detectUserDevice() {
let ua = navigator.userAgent || navigator.vendor || window.opera;
if (/android/i.test(ua)) return "Android";
if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return "iOS";
if (/windows phone/i.test(ua)) return "Windows Phone";
if (/macintosh|mac os x/i.test(ua)) return "Mac";
if (/windows/i.test(ua)) return "PC";
if (/linux/i.test(ua)) return "Linux";
return "PC";
}

window.addEventListener("DOMContentLoaded", () => {
let savedSession = localStorage.getItem("ActiveSessionUser");
if(savedSession){
let users = getUsers();
let found = users.find(u => u.username === savedSession);
if(found){
currentUser = found;
checkAndVerifyTesters(users);
unlockVault();
parseUrlRoute();
}
}

window.addEventListener('popstate', () => {
if(currentUser) {
parseUrlRoute();
}
});
});

function checkAndVerifyTesters(users){
let testers = ["StrangeWorld"];
let updated = false;
users.forEach(u => {
if(testers.includes(u.username) && !u.verified){
u.verified = true;
updated = true;
}
if(u.username === "StrangeWorld" && !u.avatar){
u.avatar = "Icon.png";
updated = true;
}
});
if(updated){
saveUsers(users);
}
}

function parseUrlRoute(){
let hash = window.location.hash;
let cleanHash = hash.replace("#", "").trim();
if(cleanHash.startsWith("/")) {
cleanHash = cleanHash.substring(1);
}

if(cleanHash && cleanHash.toLowerCase() !== "store"){
viewingProfileUser = cleanHash;
} else {
viewingProfileUser = null;
}
loadCommunityData();
loadFeed();
}

function navigateToProfile(username){
viewingProfileUser = username;
window.location.hash = `#${username}`;
loadCommunityData();
loadFeed();
}

function goHome(){
viewingProfileUser = null;
window.location.hash = "#";
loadCommunityData();
loadFeed();
}

window.navigateToProfile = navigateToProfile;
window.goHome = goHome;

function show(id){
document.querySelectorAll(".auth-card").forEach(x=>{
x.classList.add("hidden");
});
document.getElementById(id).classList.remove("hidden");
}
window.show = show;

function toggleMainView(){
let storeView = document.getElementById("view-store");
let communityView = document.getElementById("view-community");
let btn = document.getElementById("nav-switch-btn");

if(currentActiveView === "store"){
storeView.classList.remove("active-view");
communityView.classList.add("active-view");
btn.innerText = "STORE";
currentActiveView = "community";
} else {
communityView.classList.remove("active-view");
storeView.classList.add("active-view");
btn.innerText = "COMMUNITY";
currentActiveView = "store";
}
}
window.toggleMainView = toggleMainView;

function getUsers(){
let data = localStorage.getItem("UsersDB");
if(!data) return [];
try{ return JSON.parse(atob(data)); }catch{ return []; }
}

function saveUsers(users){
localStorage.setItem("UsersDB", btoa(JSON.stringify(users)));
}

function getPosts(){
let data = localStorage.getItem("PostsDB");
if(!data) return [];
try{ return JSON.parse(data); }catch{ return []; }
}

function savePosts(posts){
localStorage.setItem("PostsDB", JSON.stringify(posts));
}

function getGames(){
let data = localStorage.getItem("GamesDB");
if(!data) return [];
try{ return JSON.parse(data); }catch{ return []; }
}

function saveGames(games){
localStorage.setItem("GamesDB", JSON.stringify(games));
}

function sendCode(){
let email = document.getElementById("reg-mail").value;
let user = document.getElementById("reg-user").value;
let birth = document.getElementById("reg-birth").value;

if(!email || !user || !birth){
alert("Complete all fields");
return;
}

registerCode = Math.floor(100000 + Math.random()*900000).toString();
tempUser = { username:user, email:email, birth:birth, friends:[], requests:[], bannedUntil: 0, avatar: "", verified: false };

emailjs.send(
EMAIL_SERVICE,
TEMPLATE_REGISTER,
{
email: email,
to_email: email,
to_name: user,
verification_code: registerCode
}
)
.then(()=>{
document.getElementById("verify-box").classList.remove("hidden");
alert("Code sent");
})
.catch(err=>{
console.log(err);
alert("Email error");
});
}
window.sendCode = sendCode;

function verifyCode(){
let code = document.getElementById("reg-code").value;
if(code !== registerCode){
alert("Invalid code");
return;
}
show("view-password");
}
window.verifyCode = verifyCode;

function createAccount(){
let pass = document.getElementById("new-password").value;
let confirm = document.getElementById("confirm-password").value;

if(pass.length < 6){
alert("Password minimum 6 characters");
return;
}
if(pass !== confirm){
alert("Passwords don't match");
return;
}

let users = getUsers();
if(users.some(u => u.username === tempUser.username)){
alert("Username already taken");
return;
}

let initialAvatar = tempUser.username === "StrangeWorld" ? "Icon.png" : "";
let isVerified = tempUser.username === "StrangeWorld" ? true : false;

users.push({
username: tempUser.username,
email: tempUser.email,
birth: tempUser.birth,
password: pass,
friends: [],
requests: [],
bannedUntil: 0,
avatar: initialAvatar,
verified: isVerified
});

saveUsers(users);
alert("Account created successfully. Your profile link is /Store/#" + tempUser.username);
show("view-start");
}
window.createAccount = createAccount;

function login(){
let user = document.getElementById("id-input").value;
let pass = document.getElementById("login-password").value;
let users = getUsers();

let found = users.find(x => (x.username === user || x.email === user) && x.password === pass);

if(!found){
alert("Invalid credentials");
return;
}

if(found.bannedUntil && Date.now() < found.bannedUntil){
let remaining = Math.ceil((found.bannedUntil - Date.now()) / 60000);
alert("Your account is suspended. Try again in " + remaining + " minutes.");
return;
}

checkAndVerifyTesters(users);
currentUser = found;
localStorage.setItem("ActiveSessionUser", currentUser.username);
unlockVault();
parseUrlRoute();
}
window.login = login;

function sendRecovery(){
let email = document.getElementById("recover-email").value;
if(!email){
alert("Email required");
return;
}

recoveryCode = Math.floor(100000 + Math.random()*900000).toString();

emailjs.send(
EMAIL_SERVICE,
TEMPLATE_RECOVERY,
{
email: email,
to_email: email,
verification_code: recoveryCode
}
)
.then(()=>{
document.getElementById("recover-box").classList.remove("hidden");
alert("Recovery code sent");
})
.catch(err=>{
console.log(err);
alert("Email error");
});
}
window.sendRecovery = sendRecovery;

function changePassword(){
let email = document.getElementById("recover-email").value;
let code = document.getElementById("recover-code").value;
let newPass = document.getElementById("recover-new-pass").value;

if(code !== recoveryCode){
alert("Invalid recovery code");
return;
}

let users = getUsers();
let index = users.findIndex(x => x.email === email);
if(index === -1){
alert("Account not found");
return;
}

users[index].password = newPass;
saveUsers(users);
alert("Password changed successfully");
show("view-start");
}
window.changePassword = changePassword;

function unlockVault(){
document.getElementById("auth-system").style.display="none";
document.getElementById("vault-ui").classList.add("unlocked");

renderUserProfile();
renderStoreGames();
}

function renderUserProfile(){
let displayName = currentUser.username;
if(currentUser.verified){
displayName += ` ${VERIFIED_BADGE_HTML}`;
}
document.getElementById("user-display").innerHTML = displayName;

let avatarImg = document.getElementById("avatar-img");
let avatarFallback = document.getElementById("avatar-fallback");

let activeAvatar = currentUser.username === "StrangeWorld" && !currentUser.avatar ? "Icon.png" : currentUser.avatar;

if(activeAvatar){
avatarImg.src = activeAvatar;
avatarImg.classList.remove("hidden");
avatarFallback.classList.add("hidden");
} else {
avatarImg.classList.add("hidden");
avatarFallback.classList.remove("hidden");
}
}

function uploadAvatar(input){
if(input.files && input.files[0]){
let reader = new FileReader();
reader.onload = function(e){
let base64Image = e.target.result;
currentUser.avatar = base64Image;

let users = getUsers();
let idx = users.findIndex(u => u.username === currentUser.username);
if(idx !== -1){
users[idx].avatar = base64Image;
saveUsers(users);
}

renderUserProfile();
loadFeed();
};
reader.readAsDataURL(input.files[0]);
}
}
window.uploadAvatar = uploadAvatar;

function logout(){
localStorage.removeItem("ActiveSessionUser");
location.reload();
}
window.logout = logout;

function calculateAge(date){
let birth = new Date(date);
let today = new Date();
let age = today.getFullYear() - birth.getFullYear();
let month = today.getMonth() - birth.getMonth();
if(month < 0 || (month === 0 && today.getDate() < birth.getDate())){
age--;
}
return age;
}

e.stopPropagation();
let dropdown = document.getElementById("add-game-dropdown");
if(dropdown){
dropdown.classList.toggle("hidden");
}
}
window.toggleAddGameDropdown = toggleAddGameDropdown;

window.addEventListener("click", () => {
let dropdown = document.getElementById("add-game-dropdown");
if(dropdown && !dropdown.classList.contains("hidden")){
dropdown.classList.add("hidden");
}
});

function toggleGameStatusInput(val){
let urlInput = document.getElementById("new-game-url");
if(val === "coming"){
urlInput.classList.add("hidden");
} else {
urlInput.classList.remove("hidden");
}
}
window.toggleGameStatusInput = toggleGameStatusInput;

function publishNewGame(){
let title = document.getElementById("new-game-title").value.trim();
let device = document.getElementById("new-game-device").value;
let status = document.getElementById("new-game-status").value;
let downloadUrl = document.getElementById("new-game-url").value.trim();
let hasMs = document.getElementById("new-game-has-ms").checked;
let msUrl = document.getElementById("new-game-ms-url").value.trim();
let logoInput = document.getElementById("new-game-logo-file");

if(!title){
alert("Introduce el nombre del juego");
return;
}

if(status === "available" && !downloadUrl){
alert("Introduce el enlace de descarga");
return;
}

if(hasMs && !msUrl){
alert("Introduce el enlace de descarga de Microsoft");
return;
}

let saveGameData = (logoBase64) => {
try {
let games = getGames();
let newGame = {
id: Date.now().toString(),
title: title,
device: device,
status: status,
downloadUrl: status === "coming" ? "" : downloadUrl,
hasMicrosoft: hasMs,
microsoftUrl: hasMs ? msUrl : "",
logo: logoBase64 || ""
};
games.push(newGame);
saveGames(games);
renderStoreGames();
alert("¡Juego publicado con éxito!");
} catch(err) {
console.error(err);
alert("Error al guardar: La imagen es demasiado pesada para el almacenamiento local.");
}
};

if(logoInput.files && logoInput.files[0]){
let reader = new FileReader();
reader.onload = function(e){
saveGameData(e.target.result);
};
reader.readAsDataURL(logoInput.files[0]);
} else {
saveGameData("");
}
}
window.publishNewGame = publishNewGame;

function deleteGame(gameId){
if(!currentUser || currentUser.username !== "StrangeWorld") return;
if(!confirm("¿Seguro que deseas eliminar este juego?")) return;

let games = getGames();
games = games.filter(g => g.id !== gameId);
saveGames(games);
renderStoreGames();
}
window.deleteGame = deleteGame;

function handleUserSearchInput(query){
let container = document.getElementById("search-results-container");
if(!query.trim()){
container.classList.add("hidden");
container.innerHTML = "";
return;
}

let users = getUsers();
let q = query.toLowerCase();

let scoredUsers = users.map(u => {
let uLower = u.username.toLowerCase();
let score = 0;
if(uLower === q) score = 100;
else if(uLower.startsWith(q)) score = 50;
else if(uLower.includes(q)) score = 25;
return { user: u, score: score };
}).filter(item => item.score > 0);

scoredUsers.sort((a, b) => b.score - a.score);

if(scoredUsers.length === 0){
container.innerHTML = '<div style="padding:10px; color:#777; text-align:center; font-size:0.85rem;">No users found</div>';
container.classList.remove("hidden");
return;
}

let html = "";
scoredUsers.forEach(item => {
let u = item.user;
let avatarSrc = u.avatar || (u.username === "StrangeWorld" ? "Icon.png" : "");
let avatarHtml = avatarSrc ? `<img src="${avatarSrc}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` : `<span style="color:var(--cyan);font-family:'Lilita One';">+</span>`;
let badge = u.verified ? VERIFIED_BADGE_HTML : "";

html += `
<div class="search-result-item" onclick="selectSearchResult('${u.username}')">
<div style="display:flex; align-items:center; gap:8px;">
${avatarHtml}
<span style="font-weight:bold; font-size:0.9rem;">${u.username} ${badge}</span>
</div>
<span style="color:var(--cyan); font-size:0.75rem;">View</span>
</div>
`;
});

container.innerHTML = html;
container.classList.remove("hidden");
}
window.handleUserSearchInput = handleUserSearchInput;

function selectSearchResult(username){
document.getElementById("friend-search-input").value = username;
document.getElementById("search-results-container").classList.add("hidden");
navigateToProfile(username);
}
window.selectSearchResult = selectSearchResult;

function sendFriendRequestFromInput(){
let targetName = document.getElementById("friend-search-input").value.trim();
if(!targetName || targetName === currentUser.username){
alert("Invalid username");
return;
}

let users = getUsers();
let targetUser = users.find(u => u.username === targetName);
if(!targetUser){
alert("User not found");
return;
}

if(targetUser.friends && targetUser.friends.includes(currentUser.username)){
alert("You are already friends");
return;
}

if(targetUser.requests && targetUser.requests.includes(currentUser.username)){
alert("Request already sent");
return;
}

if(!targetUser.requests) targetUser.requests = [];
targetUser.requests.push(currentUser.username);
saveUsers(users);
document.getElementById("friend-search-input").value = "";
document.getElementById("search-results-container").classList.add("hidden");
alert("Friend request sent!");
}
window.sendFriendRequestFromInput = sendFriendRequestFromInput;

function loadCommunityData(){
let users = getUsers();
let current = users.find(u => u.username === currentUser.username);
if(!current) return;
currentUser = current;

let reqContainer = document.getElementById("requests-container");
reqContainer.innerHTML = "";
if(!current.requests || current.requests.length === 0){
reqContainer.innerHTML = '<p style="color:#555; font-size:0.85rem;">No requests</p>';
} else {
current.requests.forEach(req => {
reqContainer.innerHTML += `
<div class="request-item">
<span>${req}</span>
<button onclick="acceptRequest('${req}')">Accept</button>
</div>
`;
});
}

let friendContainer = document.getElementById("friends-container");
friendContainer.innerHTML = "";
if(!current.friends || current.friends.length === 0){
friendContainer.innerHTML = '<p style="color:#555; font-size:0.85rem;">No friends yet</p>';
} else {
current.friends.forEach(f => {
friendContainer.innerHTML += `
<div class="friend-item" style="cursor:pointer;" onclick="navigateToProfile('${f}')">
<span>${f}</span>
<span style="color:var(--cyan); font-size:0.8rem;">Profile</span>
</div>
`;
});
}
}

function acceptRequest(fromUser){
let users = getUsers();
let current = users.find(u => u.username === currentUser.username);
let sender = users.find(u => u.username === fromUser);

current.requests = current.requests.filter(r => r !== fromUser);
if(!current.friends) current.friends = [];
current.friends.push(fromUser);

if(sender){
if(!sender.friends) sender.friends = [];
sender.friends.push(current.username);
}

saveUsers(users);
loadCommunityData();
}
window.acceptRequest = acceptRequest;

function toggleVerifyUser(username){
if(currentUser.username !== "StrangeWorld") return;
if(!confirm(`¿Deseas cambiar el estado de verificación para ${username}?`)) return;

let users = getUsers();
let target = users.find(u => u.username === username);
if(target){
target.verified = !target.verified;
saveUsers(users);
loadFeed();
alert(`Estado de verificación actualizado para ${username}.`);
}
}
window.toggleVerifyUser = toggleVerifyUser;

function createPost(){
let text = document.getElementById("post-text-content").value.trim();
let fileInput = document.getElementById("post-media-file");

if(!text && fileInput.files.length === 0){
alert("Write something or attach media");
return;
}

let handleFile = (mediaUrl, mediaType) => {
try {
let posts = getPosts();
let newPost = {
id: Date.now().toString(),
author: currentUser.username,
text: text,
mediaUrl: mediaUrl || "",
mediaType: mediaType || "",
likes: [],
comments: [],
timestamp: Date.now()
};

posts.unshift(newPost);
savePosts(posts);

document.getElementById("post-text-content").value = "";
document.getElementById("post-media-file").value = "";
loadFeed();
} catch(err) {
console.error(err);
alert("Error al publicar: El archivo multimedia es demasiado pesado para el almacenamiento local.");
}
};

if(fileInput.files.length > 0){
let file = fileInput.files[0];
let reader = new FileReader();
let mType = file.type.startsWith('video') ? 'video' : 'image';
reader.onload = function(e){
handleFile(e.target.result, mType);
};
reader.readAsDataURL(file);
} else {
handleFile(null, null);
}
}
window.createPost = createPost;

let profileHeaderContainer = document.getElementById("profile-header-container");

if(targetUserObj){
posts = posts.filter(p => p.author.toLowerCase() === targetUserObj.username.toLowerCase());
let isStrangeworld = (currentUser.username === "StrangeWorld");
let emailInfo = isStrangeworld ? `<br><span style="color:var(--orange); font-size:0.9rem;">Correo: ${targetUserObj.email}</span>` : "";

profileHeaderContainer.innerHTML = `
<div class="post-card" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px; background:#080808; border:1px solid var(--orange);">

<div>
<h2 style="font-family:'Lilita One'; font-size:2rem; display:flex; align-items:center; gap:8px;">
${targetUserObj.username} ${badge} ${verifyBtn}

postCreatorBox.classList.add("hidden");

postCreatorBox.classList.remove("hidden");

profileHeaderContainer.classList.add("hidden");

<button class="admin-btn" onclick="adminDeleteUserPosts('${post.author}')">Delete All by User</button>

  ? `<img src="${cAvatar}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;" alt="Avatar">`

<div class="post-actions">
<button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${post.id}')">
❤️ <span>${post.likes ? post.likes.length : 0}</span> Likes
</button>
</div>
${adminHtml}
<div class="comments-section">
<div style="font-size:0.9rem; font-weight:bold; margin-bottom:8px; color:#aaa;">Comments</div>
<div id="comments-list-${post.id}">
${commentsHtml}
</div>
<div class="comment-form">
<input id="comment-input-${post.id}" placeholder="Write a comment...">
<button onclick="addComment('${post.id}')">Send</button>
</div>
</div>
</div>
`;
});
}

function toggleLike(postId){
let posts = getPosts();
let post = posts.find(p => p.id === postId);
if(!post) return;

if(!post.likes) post.likes = [];
let index = post.likes.indexOf(currentUser.username);
if(index === -1){
post.likes.push(currentUser.username);
} else {
post.likes.splice(index, 1);
}

savePosts(posts);
loadFeed();
}
window.toggleLike = toggleLike;

function addComment(postId){
let input = document.getElementById(`comment-input-${postId}`);
let text = input.value.trim();
if(!text) return;

let posts = getPosts();
let post = posts.find(p => p.id === postId);
if(!post) return;

if(!post.comments) post.comments = [];
post.comments.push({
author: currentUser.username,
text: text,
timestamp: Date.now()
});

savePosts(posts);
input.value = "";
loadFeed();
}
window.addComment = addComment;

function adminDeletePost(postId){
if(currentUser.username !== "StrangeWorld") return;
if(!confirm("Are you sure you want to delete this post?")) return;

let posts = getPosts();
posts = posts.filter(p => p.id !== postId);
savePosts(posts);
loadFeed();
}
window.adminDeletePost = adminDeletePost;

function adminDeleteUserPosts(username){
if(currentUser.username !== "StrangeWorld") return;
if(!confirm("Delete all posts from user: " + username + "?")) return;

let posts = getPosts();
posts = posts.filter(p => p.author !== username);
savePosts(posts);
loadFeed();
}
window.adminDeleteUserPosts = adminDeleteUserPosts;

function adminPromptBanUser(username){
if(currentUser.username !== "StrangeWorld") return;
if(username === "StrangeWorld"){
alert("You cannot ban yourself!");
return;
}

let input = prompt(`Introduce el tiempo de baneo para ${username}:\n- Escribe un número seguido de m (minutos), h (horas), d (días)\n- O escribe "permanente" / "perpetuo" para baneo permanente.`);
if(!input) return;

input = input.trim().toLowerCase();
let banDurationMs = 0;

if(input === "permanente" || input === "perpetuo" || input === "perm"){
banDurationMs = 86400000 * 365 * 100;
} else {
let value = parseInt(input);
if(isNaN(value) || value <= 0){
alert("Formato de tiempo inválido.");
return;
}
if(input.endsWith('m')){
banDurationMs = value * 60000;
} else if(input.endsWith('h')){
banDurationMs = value * 3600000;
} else if(input.endsWith('d')){
banDurationMs = value * 86400000;
} else {
banDurationMs = value * 60000;
}
}

let users = getUsers();
let target = users.find(u => u.username.toLowerCase() === username.toLowerCase());
if(target){
target.bannedUntil = Date.now() + banDurationMs;
saveUsers(users);
alert(`User ${username} has been banned.`);
}
}
window.adminPromptBanUser = adminPromptBanUser;

</script>


</body>
